<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <title>Contact </title>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logotitle">
         <img id="logo" src="src/logo.png" alt="Logo">
         <link rel="stylesheet" href="styles.css">
      <h1>Milcodeuni</h1>
      </div>

      <ul>
        <li>
          <a href="#">Home</a>
        </li>
        <li>
          <a href="#">Help</a>
        </li>
        <li>
          <a href="#">Contact</a>
        </li>
      </ul>
    </header>

    <main>
      <h2>Contact Form</h2>
      <p>Send us a message and we will get back to you as soon as possible.</p>

      <!-- Form -->
      <form>
        <div>
          <label for="name">full name *:</label>
          <input type="text" id="name" required />
        </div><br />

        <div>
          <label for="email"> email *:</label>
          <input type="email" id="email" required />
        </div><br />

        <div>
          <label for="message">Select:</label>
          <select id="message">
            <option value="question">Question</option>
            <option value="feedback">Feedback</option>
            <option value="complaint">Complaint</option>
          </select>
        </div>

        <div>
          <label for="context">How did you hear about us?</label>
          <input
            type="radio"
            id="context"
            value="social media"
            name="context"
          />
          Social Media
        </div>

        <div>
          <label for="check">your agreement</label>
          <input type="checkbox" id="check" value="social media" name="check" />
        </div>

        <input type="submit" />
      </form>
    </main>

    <footer>
      <p>&copy; 2024 Milcodeuni. All rights reserved.</p>
    </footer>
  </body>
</html>
